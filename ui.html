<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RFM Repurchase UI</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:820px;margin:40px auto;padding:0 16px;color:#111}
    h1{margin:0 0 8px;font-size:34px}
    .sub{color:#555;margin:0 0 24px}
    .card{border:1px solid #e5e5e5;border-radius:14px;padding:18px;background:#fff}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
    label{display:block;font-size:12px;color:#555;margin:0 0 6px}
    input,select,button{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #ddd}
    input,select{min-width:220px}
    button{cursor:pointer;background:#111;color:#fff;border:1px solid #111}
    button.secondary{background:#fff;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f3f3f3;color:#333;font-size:12px;margin-right:8px}
    pre{background:#0b0b0b;color:#eaeaea;padding:14px;border-radius:12px;overflow:auto;min-height:140px}
    .err{color:#b00020;font-size:13px;margin-top:8px}
    .ok{color:#0a7a25;font-size:13px;margin-top:8px}
    .muted{color:#666;font-size:12px;margin-top:12px}
  </style>
</head>
<body>
  <h1>RFM Repurchase Decision</h1>
  <p class="sub">Minimal UI (no backend). Fetch customer → choose reward → save.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>EC2 API Base URL</label>
        <input id="base" placeholder="http://34.234.xx.xx:8080" />
      </div>
      <div>
        <label>Customer ID</label>
        <input id="cid" type="number" value="12346" />
      </div>
      <div>
        <button id="btnFetch">Fetch Customer</button>
      </div>
      <div>
        <button id="btnClear" class="secondary">Clear</button>
      </div>
    </div>

    <div style="margin-top:14px">
      <span class="pill" id="seg">Segment: -</span>
      <span class="pill" id="pred">Pred: -</span>
    </div>

    <div class="row" style="margin-top:14px">
      <div>
        <label>Choose reward</label>
        <select id="choice" disabled>
          <option value="">— choose —</option>
        </select>
      </div>
      <div>
        <button id="btnSave" disabled>Save Choice</button>
      </div>
    </div>

    <div id="msg" class="muted"></div>
    <div id="err" class="err"></div>
    <div id="ok" class="ok"></div>

    <div style="margin-top:14px">
      <pre id="out">{}</pre>
    </div>

    <div class="muted">Tip: ถ้ากดแล้ว “Failed to fetch” = CORS/HTTP/Port ยังไม่เปิดจาก AWS หรือเปิดไฟล์แบบ file:// แล้วโดนบล็อก</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // ใส่ค่า default ให้เลย (แก้ IP ให้เป็นของแก)
  // ใส่แบบ http://34.234.17.111:8080
  $("base").value = "http://34.234.17.111:8080";

  function resetUI(){
    $("seg").textContent = "Segment: -";
    $("pred").textContent = "Pred: -";
    $("choice").innerHTML = '<option value="">— choose —</option>';
    $("choice").disabled = true;
    $("btnSave").disabled = true;
    $("out").textContent = "{}";
    $("err").textContent = "";
    $("ok").textContent = "";
    $("msg").textContent = "";
  }

  async function api(path, opts={}){
    const base = $("base").value.trim().replace(/\/+$/,"");
    const url = base + path;
    const res = await fetch(url, {
      headers: { "Content-Type":"application/json" },
      ...opts
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch { json = { raw:text }; }
    if(!res.ok){
      const msg = json?.detail || json?.error || res.statusText || "Request failed";
      throw new Error(`${res.status} ${msg}`);
    }
    return json;
  }

  $("btnFetch").onclick = async () => {
    resetUI();
    const cid = $("cid").value;
    if(!cid){ $("err").textContent = "Customer ID required"; return; }

    try{
      $("msg").textContent = "Fetching...";
      const data = await api(`/customer/${cid}`);
      $("out").textContent = JSON.stringify(data, null, 2);

      const seg = data.Segment ?? data.segment ?? "-";
      const pred = data.Pred_Repurchase_Count ?? data.pred ?? data.score ?? "-";
      const options = data.Options ?? data.options ?? [];

      $("seg").textContent = `Segment: ${seg}`;
      $("pred").textContent = `Pred: ${pred}`;

      // เติมตัวเลือก
      const sel = $("choice");
      sel.innerHTML = '<option value="">— choose —</option>';
      (options || []).forEach(opt=>{
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        sel.appendChild(o);
      });

      sel.disabled = false;
      $("btnSave").disabled = false;
      $("ok").textContent = "Fetched ✅ เลือก reward แล้วกด Save ได้เลย";
      $("msg").textContent = "";
    }catch(e){
      $("msg").textContent = "";
      $("err").textContent = "Fetch failed: " + e.message;
    }
  };

  $("btnSave").onclick = async () => {
    $("err").textContent = "";
    $("ok").textContent = "";
    const cid = Number($("cid").value);
    const selected = $("choice").value;

    if(!cid){ $("err").textContent = "Customer ID required"; return; }
    if(!selected){ $("err").textContent = "Please choose a reward"; return; }

    try{
      $("msg").textContent = "Saving...";
      const body = JSON.stringify({ customer_id: cid, selected_option: selected });
      const data = await api(`/choice`, { method:"POST", body });
      $("out").textContent = JSON.stringify(data, null, 2);
      $("ok").textContent = "Saved ✅";
      $("msg").textContent = "";
    }catch(e){
      $("msg").textContent = "";
      $("err").textContent = "Save failed: " + e.message;
    }
  };

  $("btnClear").onclick = () => resetUI();
  resetUI();
</script>
</body>
</html>
